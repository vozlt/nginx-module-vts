name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: 'build'
    runs-on: ubuntu-24.04
    steps:
      - name: 'checkout'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: nginx-module-vts
      - name: 'checkout nginx'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: nginx/nginx
          path: nginx
          ref: '017cf98dcce217946572a896f0992370475e189f'
      - name: 'checkout freenginx'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: freenginx/nginx
          path: freenginx
          ref: 'ae840a5b257282a355af1e4d20df81383f658961'
      - name: 'checkout luajit2'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: openresty/luajit2
          path: luajit2
      - name: 'checkout ngx_devel_kit'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: vision5/ngx_devel_kit
          path: ngx_devel_kit
      - name: 'checkout lua-nginx-module'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: openresty/lua-nginx-module
          path: lua-nginx-module
      - name: 'checkout lua-resty-core'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: openresty/lua-resty-core
          path: lua-resty-core
      - name: 'checkout lua-resty-lrucache'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: openresty/lua-resty-lrucache
          path: lua-resty-lrucache
      - name: 'build luajit2'
        working-directory: luajit2
        run: |
          make
          sudo make install
          sudo mkdir /usr/local/share/lua/5.1/resty
      - name: 'link resty lib'
        working-directory: /usr/local/share/lua/5.1/resty
        run: |
          sudo ln -s /home/runner/work/nginx-module-vts/nginx-module-vts/lua-resty-core/lib/resty/core core
          sudo ln -s /home/runner/work/nginx-module-vts/nginx-module-vts/lua-resty-core/lib/resty/core.lua core.lua
          sudo ln -s /home/runner/work/nginx-module-vts/nginx-module-vts/lua-resty-lrucache/lib/resty/lrucache lrucache
          sudo ln -s /home/runner/work/nginx-module-vts/nginx-module-vts/lua-resty-lrucache/lib/resty/lrucache.lua lrucache.lua
      - name: 'prepare nginx_upstream_check'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: yaoweibin/nginx_upstream_check_module
          path: nginx_upstream_check

      - name: 'patch upstream_check'
        working-directory: nginx
        run: |
          patch -p1 < /home/runner/work/nginx-module-vts/nginx-module-vts/nginx_upstream_check/check_1.20.1+.patch
      - name: 'build nginx'
        working-directory: nginx
        run: |
          ./auto/configure --with-ld-opt="-Wl,-rpath,/usr/local/lib" --add-module=/home/runner/work/nginx-module-vts/nginx-module-vts/ngx_devel_kit --add-module=/home/runner/work/nginx-module-vts/nginx-module-vts/lua-nginx-module --add-module=/home/runner/work/nginx-module-vts/nginx-module-vts/nginx-module-vts --add-module=/home/runner/work/nginx-module-vts/nginx-module-vts/nginx_upstream_check --with-http_ssl_module
          make
          sudo make install
          /usr/local/nginx/sbin/nginx -V
        env:
          LUAJIT_LIB: /usr/local/lib
          LUAJIT_INC: /usr/local/include/luajit-2.1
      - name: 'build freenginx'
        working-directory: freenginx
        run: |
          ./auto/configure --prefix=/usr/local/freenginx --with-ld-opt="-Wl,-rpath,/usr/local/lib" --add-module=/home/runner/work/nginx-module-vts/nginx-module-vts/ngx_devel_kit --add-module=/home/runner/work/nginx-module-vts/nginx-module-vts/lua-nginx-module --add-module=/home/runner/work/nginx-module-vts/nginx-module-vts/nginx-module-vts --with-http_ssl_module
          make
          sudo make install
          /usr/local/freenginx/sbin/nginx -V
        env:
          LUAJIT_LIB: /usr/local/lib
          LUAJIT_INC: /usr/local/include/luajit-2.1
      - name: 'prepare cpanm'
        run: |
          sudo apt install -y cpanminus
          sudo cpanm --notest Test::Nginx::Socket > build.log 2>&1 || (cat build.log && exit 1)
      - name: 'prepare promtool'
        env:
          # pinned, like the nginx checkout and the actions above it. Asking
          # the api for the latest release is an unauthenticated call from a
          # shared runner address, and when it is rate limited the command
          # substitution yields nothing, so curl is handed no url at all and
          # the step fails somewhere unrelated to what it was testing
          PROMETHEUS_VERSION: '3.13.2'
        run: |
          curl -fsSL -o prometheus.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          tar xzf prometheus.tar.gz
          sudo mv prometheus-*/promtool /usr/local/bin
          promtool --version
      - name: 'test'
        working-directory: nginx-module-vts
        run: |
          echo "/usr/local/nginx/sbin/" >> $GITHUB_PATH
          sudo PATH=/usr/local/nginx/sbin:$PATH prove -r t
      - name: 'test upstream check'
        working-directory: nginx-module-vts
        run: |
          echo "/usr/local/nginx/sbin/" >> $GITHUB_PATH
          sudo TEST_UPSTREAM_CHECK=1 TEST_NGINX_SLEEP=1 PATH=/usr/local/nginx/sbin:$PATH prove t/024.upstream_check.t
      - name: 'test freenginx'
        working-directory: nginx-module-vts
        run: |
          echo "/usr/local/freenginx/sbin/" >> $GITHUB_PATH
          sudo PATH=/usr/local/freenginx/sbin:$PATH prove -r t

  asan:
    name: 'asan'
    runs-on: ubuntu-24.04
    steps:
      - name: 'checkout'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: nginx-module-vts
      - name: 'checkout nginx'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: nginx/nginx
          path: nginx
          ref: '017cf98dcce217946572a896f0992370475e189f'
      - name: 'prepare cpanm'
        run: |
          sudo apt install -y cpanminus
          sudo cpanm --notest Test::Nginx::Socket > build.log 2>&1 || (cat build.log && exit 1)
      - name: 'prepare promtool'
        env:
          # pinned, like the nginx checkout and the actions above it. Asking
          # the api for the latest release is an unauthenticated call from a
          # shared runner address, and when it is rate limited the command
          # substitution yields nothing, so curl is handed no url at all and
          # the step fails somewhere unrelated to what it was testing
          PROMETHEUS_VERSION: '3.13.2'
        run: |
          curl -fsSL -o prometheus.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          tar xzf prometheus.tar.gz
          sudo mv prometheus-*/promtool /usr/local/bin
          promtool --version
      - name: 'relax ASLR entropy'
        # the sanitizer runtime cannot map its shadow memory with the high
        # entropy ASLR of the ubuntu-24.04 kernel
        run: sudo sysctl -w vm.mmap_rnd_bits=28 || true
      - name: 'build nginx with the sanitizers'
        working-directory: nginx
        run: |
          # -fno-sanitize-recover makes undefined behaviour abort the worker
          # instead of printing and carrying on, so the test that reached it
          # fails. nonnull-attribute is left out: ngx_pstrdup() hands the
          # null data pointer of an empty conf_param to ngx_memcpy() on every
          # start of nginx. Fixed upstream by b0a4d0fb82 and released in the
          # mainline 1.31.0, the stable branch does not carry it, 1.30.4
          # included, so the check stays out while the tests build a stable
          # release
          # NGX_HAVE_NONALIGNED is what lets nginx read four bytes at a
          # time from an arbitrary offset - ngx_md5.c, ngx_http_parse.c and
          # http/2 all take it. auto/os/conf turns it on for x86, which is
          # what runs here, and UndefinedBehaviorSanitizer objects whenever
          # the bytes happen to land off a four byte boundary. Whether they
          # do is down to where a string falls in memory, so the job passes
          # or fails on luck: an upstream over a long unix socket path made
          # ngx_http_upstream_init_round_robin_sid() hash from an odd
          # address and took the run down. Turn it off and nginx assembles
          # the word a byte at a time instead, which reads the same and
          # keeps the alignment check meaningful for this module
          ./auto/configure \
            --prefix=/usr/local/nginx-asan \
            --add-module=/home/runner/work/nginx-module-vts/nginx-module-vts/nginx-module-vts \
            --with-cc-opt="-DNGX_HAVE_NONALIGNED=0 -fsanitize=address,undefined -fno-sanitize=nonnull-attribute -fno-sanitize-recover=undefined -fno-omit-frame-pointer -g -O1" \
            --with-ld-opt="-fsanitize=address,undefined"
          make -j$(nproc)
          sudo make install
          /usr/local/nginx-asan/sbin/nginx -V
      - name: 'test under the sanitizers'
        working-directory: nginx-module-vts
        run: |
          # the nginx workers drop privileges, so they need to be able to
          # write their own report files
          sudo mkdir -p /tmp/asan && sudo chmod 777 /tmp/asan
          # the lua tests need modules that are not part of this build
          sudo ASAN_OPTIONS=detect_leaks=0:abort_on_error=1:disable_coredump=1:log_path=/tmp/asan/vts \
               UBSAN_OPTIONS=print_stacktrace=1:log_path=/tmp/asan/vts \
               PATH=/usr/local/nginx-asan/sbin:$PATH prove $(ls t/*.t | grep -v '_by_lua')
      - name: 'check the sanitizer reports'
        if: always()
        run: |
          if compgen -G '/tmp/asan/vts.*' > /dev/null; then
            echo '::error::the sanitizers reported errors'
            cat /tmp/asan/vts.*
            exit 1
          fi
          echo 'no sanitizer reports'
      - name: 'dump nginx error log'
        if: failure()
        working-directory: nginx-module-vts
        run: sudo tail -n 100 t/servroot/logs/error.log || true

  coverage:
    name: 'coverage'
    runs-on: ubuntu-24.04
    permissions:
      # the badge is a single file force pushed to the `badges` branch, and
      # the summary is left on the pull request as one comment that later runs
      # replace
      contents: write
      pull-requests: write
    steps:
      - name: 'checkout'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: nginx-module-vts
      - name: 'checkout nginx'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: nginx/nginx
          path: nginx
          ref: '017cf98dcce217946572a896f0992370475e189f'
      - name: 'prepare cpanm'
        run: |
          sudo apt install -y cpanminus gcovr
          sudo cpanm --notest Test::Nginx::Socket > build.log 2>&1 || (cat build.log && exit 1)
      - name: 'prepare promtool'
        env:
          # pinned, for the reason given in the job above
          PROMETHEUS_VERSION: '3.13.2'
        run: |
          curl -fsSL -o prometheus.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          tar xzf prometheus.tar.gz
          sudo mv prometheus-*/promtool /usr/local/bin
          promtool --version
      - name: 'build nginx with coverage'
        working-directory: nginx
        run: |
          # -O0 so that the arcs the counters are attached to still match the
          # lines they were written for
          ./auto/configure \
            --prefix=/usr/local/nginx-cov \
            --add-module=/home/runner/work/nginx-module-vts/nginx-module-vts/nginx-module-vts \
            --with-cc-opt="--coverage -O0" \
            --with-ld-opt="--coverage"
          make -j$(nproc)
          sudo make install
          /usr/local/nginx-cov/sbin/nginx -V
      - name: 'test'
        working-directory: nginx-module-vts
        run: |
          # the lua tests need modules that are not part of this build
          sudo PATH=/usr/local/nginx-cov/sbin:$PATH prove $(ls t/*.t | grep -v '_by_lua')
      - name: 'collect'
        run: |
          # the workers run as root and leave their counters behind as root
          sudo chown -R "$(id -u):$(id -g)" nginx/objs
          gcovr --root "$GITHUB_WORKSPACE/nginx-module-vts" \
                --filter "$GITHUB_WORKSPACE/nginx-module-vts/src/" \
                --cobertura "$GITHUB_WORKSPACE/coverage.xml" \
                --print-summary \
                "$GITHUB_WORKSPACE/nginx/objs/addon/src"
      - name: 'summarise'
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: coverage.xml
          badge: true
          format: markdown
          hide_complexity: true
          output: both
          thresholds: '60 80'
      - name: 'add the summary to the run'
        run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"
      - name: 'comment on the pull request'
        # a pull request from a fork is handed a read only token, so the
        # comment cannot be written and the run summary is where to read it
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: coverage
          recreate: true
          path: code-coverage-results.md
      - name: 'publish the badge'
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nginx-module-vts/util/coverage-badge.sh coverage.xml
      - name: 'dump nginx error log'
        if: failure()
        working-directory: nginx-module-vts
        run: sudo tail -n 100 t/servroot/logs/error.log || true

  lockcheck:
    name: 'lock discipline'
    runs-on: ubuntu-24.04
    steps:
      - name: 'checkout'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: nginx-module-vts
      - name: 'checkout nginx'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: nginx/nginx
          path: nginx
          ref: '017cf98dcce217946572a896f0992370475e189f'
      - name: 'prepare cpanm'
        run: |
          sudo apt install -y cpanminus
          sudo cpanm --notest Test::Nginx::Socket > build.log 2>&1 || (cat build.log && exit 1)
      - name: 'prepare promtool'
        env:
          # pinned, for the reason given in the job above
          PROMETHEUS_VERSION: '3.13.2'
        run: |
          curl -fsSL -o prometheus.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          tar xzf prometheus.tar.gz
          sudo mv prometheus-*/promtool /usr/local/bin
          promtool --version
      - name: 'build nginx with the lock check linked in'
        working-directory: nginx
        run: |
          cc -c -o "$GITHUB_WORKSPACE/lockcheck.o" \
             "$GITHUB_WORKSPACE/nginx-module-vts/util/lockcheck.c"
          ./auto/configure \
            --prefix=/usr/local/nginx-lc \
            --add-module="$GITHUB_WORKSPACE/nginx-module-vts" \
            --with-ld-opt="-Wl,--wrap=ngx_shmtx_lock \
                           -Wl,--wrap=ngx_shmtx_unlock \
                           -Wl,--wrap=ngx_http_vhost_traffic_status_find_node \
                           $GITHUB_WORKSPACE/lockcheck.o"
          make -j$(nproc)
          sudo make install
          # the wrapper is only useful if the linker actually redirected
          nm /usr/local/nginx-lc/sbin/nginx | grep -q '__wrap_ngx_http_vhost_traffic_status_find_node'
      - name: 'prove the check can fail'
        working-directory: nginx-module-vts
        run: |
          # #355 is what this is for: set_by_filter walked the tree without
          # taking the mutex. Put that back, and the check has to say so - a
          # detector that has never detected anything is not evidence.
          cp src/ngx_http_vhost_traffic_status_set.c /tmp/set.c.orig
          # the lock is replaced rather than deleted: dropping both lines
          # leaves shpool set and never read, and -Werror stops the build
          # before the check gets a chance to say anything
          # one call each: a backslash before a newline inside single quotes
          # is not a continuation, it is a backslash, and sed reads it as the
          # start of an address it never finds the end of
          sed -i 's|ngx_shmtx_lock(&shpool->mutex);|(void) shpool;|' src/ngx_http_vhost_traffic_status_set.c
          sed -i 's|ngx_shmtx_unlock(&shpool->mutex);||' src/ngx_http_vhost_traffic_status_set.c
          grep -q '(void) shpool;' src/ngx_http_vhost_traffic_status_set.c
          ! grep -q 'ngx_shmtx_' src/ngx_http_vhost_traffic_status_set.c
          ( cd ../nginx && make -j$(nproc) > /dev/null && sudo make install > /dev/null )
          sudo rm -f /tmp/vts-lockcheck.log
          sudo PATH=/usr/local/nginx-lc/sbin:$PATH prove t/021.set_by_filter.t > /dev/null 2>&1 || true
          if [ ! -s /tmp/vts-lockcheck.log ]; then
            echo '::error::the lock check did not report the violation it was given'
            exit 1
          fi
          echo "detected $(wc -l < /tmp/vts-lockcheck.log) violation(s), as it should"
          cp /tmp/set.c.orig src/ngx_http_vhost_traffic_status_set.c
          ( cd ../nginx && make -j$(nproc) > /dev/null && sudo make install > /dev/null )
      - name: 'run the suite under it'
        working-directory: nginx-module-vts
        run: |
          sudo rm -f /tmp/vts-lockcheck.log
          # the lua tests need modules that are not part of this build
          sudo PATH=/usr/local/nginx-lc/sbin:$PATH prove $(ls t/*.t | grep -v '_by_lua')
      - name: 'check the report'
        if: always()
        run: |
          if [ -s /tmp/vts-lockcheck.log ]; then
            echo '::error::the tree was walked without the mutex'
            sort /tmp/vts-lockcheck.log | uniq -c
            exit 1
          fi
          echo 'no violations'
      - name: 'dump nginx error log'
        if: failure()
        working-directory: nginx-module-vts
        run: sudo tail -n 100 t/servroot/logs/error.log || true

  build-variants:
    name: 'build (${{ matrix.variant.name }})'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant:
          # NGX_HTTP_CACHE guards a fair amount of the module, both states
          # have to compile
          - name: 'with cache'
            opts: ''
          - name: 'without cache'
            opts: '--without-http-cache'
    steps:
      - name: 'checkout'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: nginx-module-vts
      - name: 'checkout nginx'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: nginx/nginx
          path: nginx
          ref: '017cf98dcce217946572a896f0992370475e189f'
      - name: 'build nginx'
        working-directory: nginx
        run: |
          ./auto/configure ${{ matrix.variant.opts }} \
            --add-module=/home/runner/work/nginx-module-vts/nginx-module-vts/nginx-module-vts
          make -j$(nproc)

  front:
    name: 'front'
    runs-on: ubuntu-24.04
    steps:
      - name: 'checkout'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: 'prepare node'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json
      - name: 'install'
        working-directory: front
        run: npm ci
      - name: 'lint'
        working-directory: front
        run: npm run lint
      - name: 'test'
        working-directory: front
        run: npm test
      - name: 'build'
        working-directory: front
        run: npm run build
